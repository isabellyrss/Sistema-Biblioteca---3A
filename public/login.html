<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login do Aluno · Biblioteca</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; background: var(--fundo); height: 100vh; margin: 0; }
  .login-box { background: var(--branco); padding: 40px; border-radius: 22px; box-shadow: var(--sombra); width: 100%; max-width: 400px; text-align: center; }
  .login-box h2 { color: var(--texto); margin-bottom: 8px; }
  .login-box p { color: var(--texto-suave); font-size: 14px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--bege); background: var(--fundo); margin-bottom: 16px; font-size: 14px; outline: none; box-sizing: border-box; }
  .login-box input:focus { border-color: var(--rosa-forte); background: var(--branco); }
  .login-box button { width: 100%; margin-top: 8px; }
  .back-link { display: block; margin-top: 20px; font-size: 13px; color: var(--texto-suave); text-decoration: none; }
  .back-link:hover { color: var(--rosa-forte); }
</style>
</head>
<body>

<div class="login-box">
  <div class="logo-icon" style="margin: 0 auto 16px; width: 60px; height: 60px; font-size: 30px;">🎓</div>
  <h2>Portal do Aluno</h2>
  <p>Acesse para ver seus empréstimos</p>
  
  <form id="form-login">
    <input type="text" id="login-matricula" placeholder="Sua matrícula" required>
    <input type="password" id="login-senha" placeholder="Sua senha (padrão: matrícula)" required>
    <button type="submit" class="btn primary">Entrar</button>
  </form>

  <a href="index.html" class="back-link">← Voltar para o painel</a>
</div>

<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const matricula = document.getElementById('login-matricula').value;
  const senha = document.getElementById('login-senha').value;

  const res = await fetch('/api/login-aluno', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ matricula, senha })
  });

  if (res.ok) {
    const aluno = await res.json();
    localStorage.setItem('alunoLogado', JSON.stringify(aluno));
    window.location.href = 'portal.html';
  } else {
    const err = await res.json();
    alert(err.error);
  }
});
</script>
</body>
</html>
